name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125
  EVVDROID_ABIS: arm64-v8a,armeabi-v7a
  EVVDROID_LANGS: lang/enus lang/engb lang/dede lang/eses lang/esus lang/frfr lang/frca lang/itit lang/plpl lang/jajp lang/ptbr lang/fifi

jobs:
  build:
    name: release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore sources and apply fixes
        run: |
          git show 800a9b60ab6e5a0491bce180d90a6be877bb41d3:app/src/main/kotlin/org/evvdroid/EvvTtsService.kt > app/src/main/kotlin/org/evvdroid/EvvTtsService.kt
          # Prefer clean upstream punctuation if history has it
          git show 800a9b60ab6e5a0491bce180d90a6be877bb41d3:app/src/main/kotlin/org/evvdroid/PunctuationProcessing.kt > app/src/main/kotlin/org/evvdroid/PunctuationProcessing.kt 2>/dev/null || true
          patch -p1 < ci/dict-fix.patch
          patch -p1 < ci/punct-fix.patch
          grep -q 'applyDictionary' app/src/main/kotlin/org/evvdroid/EvvTtsService.kt
          grep -q 'LEAD_MS = 120L' app/src/main/kotlin/org/evvdroid/EvvTtsService.kt
          grep -q 'isFileExtensionDot' app/src/main/kotlin/org/evvdroid/PunctuationProcessing.kt
          echo "latency + extension fixes applied"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.EVVDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/evdroid-debug.p12"
            echo "EVVDROID_KEYSTORE=$RUNNER_TEMP/evdroid-debug.p12" >> "${GITHUB_ENV}"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the release APK and compile the device checks
        run: ./gradlew assembleRelease assembleDebugAndroidTest -Pevvdroid.abis="$EVVDROID_ABIS" -Pevvdroid.minify=true -Pevvdroid.legacyPackaging=true -Pevvdroid.rules=bytecode -Pevvdroid.langs="$EVVDROID_LANGS" -Pevvdroid.versionCode="$((1000000 + GITHUB_RUN_NUMBER))" -Pevvdroid.keystore="$EVVDROID_KEYSTORE" -Pevvdroid.storePass="${{ secrets.EVVDROID_STORE_PASS }}" -Pevvdroid.keyPass="${{ secrets.EVVDROID_KEY_PASS }}" --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: evvdroid-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish the APK to the rolling release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(echo app/build/outputs/apk/release/*.apk)
          tag="ci-latest"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Latest CI build" --notes "Rolling build of the main branch; replaced on every successful run." --prerelease
          gh release upload "$tag" "$apk" --clobber
