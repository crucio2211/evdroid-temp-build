name: build

# Builds the debug APK and compiles the on-device checks.
# The engine is cross-compiled by its own Makefile (needs the NDK, Python
# and make), so this is slower than an ordinary app build: about five
# minutes of native build before Gradle even takes over.
#
# There is deliberately no emulator job: the Linux runners have no nested
# virtualization and the macOS ones never finish booting this image either,
# so the instrumented tests are compiled here and run where there is a real
# device or a working emulator:
#   ./gradlew connectedDebugAndroidTest -Pevvdroid.abis=arm64-v8a

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125
  # arm64 for phones, 32-bit ARM for older phones and watches. x86_64 is
  # emulator-only and nobody installs there, so it does not ship.
  EVVDROID_ABIS: arm64-v8a,armeabi-v7a
  # Every language the engine ships except Korean, Chinese and Portuguese,
  # which were never in the SDK it is transcribed from. Japanese travels as
  # UTF-16 through a path of its own; the rest travel as bytes.
  EVVDROID_LANGS: lang/enus lang/engb lang/dede lang/eses lang/esus lang/frfr lang/frca lang/itit lang/plpl lang/jajp

jobs:
  build:
    name: release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out without the engine submodule
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the private engine fork
        env:
          OPENVV16K_DEPLOY_KEY: ${{ secrets.OPENVV16K_DEPLOY_KEY }}
        run: |
          set -e
          [ -n "$OPENVV16K_DEPLOY_KEY" ] || { echo "OPENVV16K_DEPLOY_KEY is empty" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$OPENVV16K_DEPLOY_KEY" > ~/.ssh/openevv16k
          chmod 600 ~/.ssh/openevv16k
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/openevv16k -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
          git submodule update --init --recursive
          git -C native/openevv log --oneline -1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # No setup-android step: ubuntu-latest runners already ship the SDK
      # (ANDROID_HOME + cmdline-tools on PATH). The v3 action breaks the
      # build by asking sdkmanager for the long-removed 'tools' package.
      - name: Install the NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.EVVDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/evdroid-debug.p12"
            echo "EVVDROID_KEYSTORE=$RUNNER_TEMP/evdroid-debug.p12" >> "$GITHUB_ENV"
          fi

      - name: TEMP dump new-words in flat dict
        run: |
          grep -n " 255 255 new" native/openevv/lang/enus/enus.dict || echo "no new-words in flat dict"; echo "---"; grep -c " 255 255 new" native/openevv/lang/enus/enus.dict || true

      - name: Build the release APK and compile the device checks
        # versionCode runs far ahead of every build ever shipped: the temp
        # build host restarts its run numbers at 1, so a raw run number
        # would read as a downgrade next to an installed build and Android
        # would refuse it with "app not installed".
        run: ./gradlew assembleRelease assembleDebugAndroidTest -Pevvdroid.abis="$EVVDROID_ABIS" -Pevvdroid.minify=true -Pevvdroid.legacyPackaging=true -Pevvdroid.rules=bytecode -Pevvdroid.langs="$EVVDROID_LANGS" -Pevvdroid.versionCode="$((1000000 + GITHUB_RUN_NUMBER))" -Pevvdroid.keystore="$EVVDROID_KEYSTORE" -Pevvdroid.storePass="${{ secrets.EVVDROID_STORE_PASS }}" -Pevvdroid.keyPass="${{ secrets.EVVDROID_KEY_PASS }}" --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        # Quota failures must not block the rolling release below.
        continue-on-error: true
        with:
          name: evvdroid-release
          path: app/build/outputs/apk/release/*.apk

      # Rolling release holding the newest main-branch APK. Release assets do
      # not count against the Actions artifact quota, so the APK stays
      # downloadable even when that quota is hit.
      - name: Publish the APK to the rolling release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(echo app/build/outputs/apk/release/*.apk)
          tag="ci-latest"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Latest CI build" --notes "Rolling build of the main branch; replaced on every successful run." --prerelease
          gh release upload "$tag" "$apk" --clobber
