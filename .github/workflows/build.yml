name: build

# v8: teachWord (no eciLoadDict). Hang: dictExecutor, no lock during speech, eciStop on touch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125
  EVVDROID_ABIS: arm64-v8a,armeabi-v7a
  EVVDROID_LANGS: lang/enus lang/engb lang/dede lang/eses lang/esus lang/frfr lang/frca lang/itit lang/plpl lang/jajp lang/ptbr lang/fifi

jobs:
  build:
    name: release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore EvvTtsService + v8 teachWord (hang-safe)
        run: |
          python3 ci/hang_fix_evvtts.py
          python3 ci/hang_fix_v3_extra.py
          python3 ci/hang_fix_v4_no_eciload.py
          python3 ci/hang_fix_v5_rate_stop.py
          python3 ci/hang_fix_v6.py
          python3 ci/hang_fix_v7_restore_native_dict.py
          python3 ci/hang_fix_v8_teachword_fast.py
          python3 ci/fix_evvengine_rate.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.EVVDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/evdroid-debug.p12"
            echo "EVVDROID_KEYSTORE=$RUNNER_TEMP/evdroid-debug.p12" >> "$GITHUB_ENV"
          fi

      - name: Make scripts executable
        run: chmod +x gradlew native/build-native.sh

      - name: Build the release APK and compile the device checks
        run: ./gradlew assembleRelease assembleDebugAndroidTest -Pevvdroid.abis="$EVVDROID_ABIS" -Pevvdroid.minify=true -Pevvdroid.legacyPackaging=true -Pevvdroid.rules=c -Pevvdroid.langs="$EVVDROID_LANGS" -Pevvdroid.versionCode="$((1000000 + GITHUB_RUN_NUMBER))" -Pevvdroid.keystore="$EVVDROID_KEYSTORE" -Pevvdroid.storePass="${{ secrets.EVVDROID_STORE_PASS }}" -Pevvdroid.keyPass="${{ secrets.EVVDROID_KEY_PASS }}" --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: evvdroid-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish the APK to the rolling release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(echo app/build/outputs/apk/release/*.apk)
          tag="ci-latest"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Latest CI build" --notes "Rolling build of the main branch; replaced on every successful run." --prerelease
          gh release upload "$tag" "$apk" --clobber
