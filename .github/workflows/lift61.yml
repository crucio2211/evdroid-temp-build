name: lift61

# Temp-only: lift 6.1 US English intonation rules out of Apple's module
# with Mudb0y's lift64, to port the 6.1 exclamation to our English build.
# Needs only stock LLVM (Mach-O disassembly) + the vendored enu.dylib.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lift:
    name: lift 6.1 enus intonation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the temp tree (for helper scripts)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install LLVM disassembly tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qy llvm
          llvm-nm --version | head -1
          llvm-objdump --version | head -1

      - name: Fetch the lift tools and the 6.1 US English module
        run: |
          git clone --depth 1 https://github.com/Mudb0y/openevv.git /tmp/upstream
          curl -sSL -o /tmp/enu.dylib https://raw.githubusercontent.com/Mudb0y/Apple-Eloquence-ELF/main/vendor/tvOS-18.2/enu.dylib
          ls -l /tmp/enu.dylib
          python3 "$GITHUB_WORKSPACE/.github/scripts/thin-fat.py" /tmp/enu.dylib x86_64 /tmp/enu-x64.dylib
          ls -l /tmp/enu-x64.dylib
          llvm-nm -n /tmp/enu-x64.dylib | head -5
          llvm-nm -n /tmp/enu-x64.dylib | grep -c -i exclam || true

      - name: Census the module
        run: |
          python3 /tmp/upstream/tools/rules/lift64.py census /tmp/enu-x64.dylib | tee /tmp/census.txt | head -60

      - name: Lift the phrase rules
        run: |
          set +e
          mkdir -p /tmp/lifted
          for r in exclam_phrase period_phrase question_phrase comma_phrase get_nuclear_accent mark_nuclear_accent nucl_f0 find_eng_nucleus insert_f0 get_nuclear_accent assign_sent_final_features build_phrase_final_structure; do
            echo "=== $r ==="
            python3 /tmp/upstream/tools/rules/lift64.py rule /tmp/enu-x64.dylib "$r" > "/tmp/lifted/$r.up" 2>"/tmp/lifted/$r.err"; echo "exit=$?"
            wc -l "/tmp/lifted/$r.up" 2>/dev/null || echo "(no output)"
            head -20 "/tmp/lifted/$r.err" 2>/dev/null || true
          done
          exit 0

      - name: Upload the lifted rules
        uses: actions/upload-artifact@v4
        with:
          name: lifted-61-enus-phrases
          path: |
            /tmp/lifted/
            /tmp/census.txt
