name: oracle

# Our-side accent oracle, to hold against ETI measurements taken on real
# hardware. Builds the desktop phonemes harness (English only) and prints
# what our engine says each case is made of -- phones and word accents --
# into the run log, so no artifact storage is touched. Run it from the
# Actions tab or with: gh workflow run oracle -R crucio2211/evdroid-private
#
# Nothing here runs on this machine; that is the point. See README.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language module to build (e.g. lang/enus, lang/eses)'
        required: false
        default: 'lang/enus'

permissions:
  contents: read

jobs:
  accents:
    name: our accents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out without the engine submodule
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the private engine fork
        env:
          OPENVV16K_DEPLOY_KEY: ${{ secrets.OPENVV16K_DEPLOY_KEY }}
        run: |
          set -e
          [ -n "$OPENVV16K_DEPLOY_KEY" ] || { echo "OPENVV16K_DEPLOY_KEY is empty" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$OPENVV16K_DEPLOY_KEY" > ~/.ssh/openevv16k
          chmod 600 ~/.ssh/openevv16k
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/openevv16k -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
          git submodule update --init --recursive
          git -C native/openevv log --oneline -1

      - name: Lay our patches on
        run: |
          for patch in "$GITHUB_WORKSPACE"/native/patches/*.patch; do
            [ -e "$patch" ] || continue
            git -C native/openevv apply --whitespace=nowarn "$patch"
            echo "applied $(basename "$patch")"
          done

      - name: Build the phonemes harness
        working-directory: native/openevv
        run: make phonemes-bin LANGS="${{ inputs.lang }}" RULES="bytecode" -j"$(nproc)"

      - name: Say what our engine hears
        working-directory: native/openevv
        # With the hetero filter on, exactly like the app runs it: forced
        # readings must show up as annotations in the answers.
        env:
          EVV_HETERO: "on"
          EVV_HETERO_TRACE: "on"
          EVV_ANNO: "1"
        run: |
          echo "hetero-env=[$EVV_HETERO]"
          tag="$(basename "${{ inputs.lang }}")"
          cases="../accent-cases.txt"
          [ -f "../accent-cases-$tag.txt" ] && cases="../accent-cases-$tag.txt"
          bin="./build/phonemes-$tag"
          [ -x "$bin" ] || bin="./build/phonemes"
          "$bin" "$cases"

      - name: Trace which phrase rules dispatch
        working-directory: native/openevv
        # DELTA_RULE_TRACE=1 logs every rule that reaches backtracking as
        # "# <rule> dispatches". Grep keeps only the phrase classifiers, so
        # the log stays small: exclam firing mid-sentence but not finally
        # (or at all) names the layer the fix belongs in.
        env:
          EVV_HETERO: "on"
          EVV_ANNO: "1"
          DELTA_RULE_TRACE: "1"
        run: |
          bin="./build/phonemes-enus"
          [ -x "$bin" ] || bin="./build/phonemes"
          for case in 'hey! listen' 'listen hey!' 'hey!' 'hey? listen' 'hey. listen'; do
            echo "== $case"
            printf '%s\n' "$case" > /tmp/one.txt
            "$bin" /tmp/one.txt 2>&1 | grep -E "# (exclam|question|period|comma)_phrase dispatches" | sort | uniq -c
          done
          echo "== tone fields: hey! vs hey? vs hey."
          for case in 'hey!' 'hey?' 'hey.'; do
            echo "== $case"
            printf '%s\n' "$case" > /tmp/one.txt
            DELTA_RULE_TRACE=1 EVV_HETERO=on EVV_ANNO=1 "$bin" /tmp/one.txt 2>&1 | grep -E "# [a-z_0-9]+ dispatches" | sort | uniq -c | sort -rn
          done
          echo "== entry markers per mark (no truncation: markers only)"
          for mark in 'hey!' 'hey?' 'hey.'; do
            echo "== $mark"
            printf '%s\n' "$mark" > /tmp/one.txt
            stdbuf -o0 -e0 env DELTA_RULE_TRACE=200000 EVV_HETERO=on EVV_ANNO=1 "$bin" /tmp/one.txt 2>&1 | grep -E "# store 4 at .*0000007[bcde]"
          done
          echo "== small-value stores, one process, three marks (stable heap)"
          printf '%s\n' 'hey!' 'hey?' 'hey.' > /tmp/three.txt
          stdbuf -o0 -e0 env DELTA_RULE_TRACE=200000 EVV_HETERO=on EVV_ANNO=1 "$bin" /tmp/three.txt 2>&1 | grep -E "# store [24] at|\[\.1he[\]\?\!\.]" | grep -B1 -E "0000007d|0000007e|\[\.1he" | head -100

      - name: Measure F0 contours
        working-directory: native/openevv
        # Objective pitch data: the phonemes battery cannot see F0, so ears
        # were the only judge. The Klatt tap writes every synthesis frame;
        # the f0 column over voiced frames says rise, fall or flat in
        # numbers, per final mark, on every build.
        run: |
          make probe LANGS="lang/enus" RULES="bytecode" -j"$(nproc)"
          for case in 'hey!' 'hey?' 'hey.' 'hello!' 'hello?' 'hello.' 'I went home!' 'I went home?' 'I went home.'; do
            printf '%s\n' "$case" > /tmp/f0case.txt
            rm -f /tmp/f0tap.tsv
            EVV_KLATT_TAP=/tmp/f0tap.tsv EVV_HETERO=on ./build/probe @/tmp/f0case.txt /tmp/f0case.wav
            python3 -c "
          import sys
          rows = []
          for line in open('/tmp/f0tap.tsv'):
              if line.startswith('#') or line.startswith('step\t'):
                  continue
              p = line.rstrip().split('\t')
              if len(p) >= 2:
                  rows.append((int(p[0]), int(p[1])))
          voiced = [(s, f) for s, f in rows if f > 0]
          n = len(voiced)
          if n == 0:
              print('$case: NO VOICED FRAMES'); sys.exit()
          mean = sum(f for _, f in voiced) / n
          q = n // 4
          first = sum(f for _, f in voiced[:q] or voiced) / max(1, len(voiced[:q]))
          last = sum(f for _, f in voiced[-q:] or voiced) / max(1, len(voiced[-q:]))
          print('$case: frames=%d voiced=%d f0mean=%.1f f0max=%d firstQ=%.1f lastQ=%.1f slope=%+.1f' % (
              len(rows), n, mean, max(f for _, f in voiced), first, last, last - first))
          "
          done

      - name: Measure loudness headroom
        working-directory: native/openevv
        # How loud each mark renders (WAV RMS/peak) and what the voices
        # ship at: sizes the coming exclamation boost from data.
        run: |
          ./build/openevv-say --voices 2>&1 | head -20
          for case in 'hey!' 'hey?' 'hey.'; do
            printf '%s\n' "$case" > /tmp/loud.txt
            rm -f /tmp/loud.wav
            EVV_HETERO=on ./build/probe @/tmp/loud.txt /tmp/loud.wav
            python3 -c "
          import wave, struct, math
          w = wave.open('/tmp/loud.wav', 'rb')
          n = w.getnframes()
          raw = w.readframes(n)
          w.close()
          fmt = '<%dh' % (len(raw) // 2)
          ss = struct.unpack(fmt, raw)
          peak = max(abs(s) for s in ss) if ss else 0
          rms = math.sqrt(sum(s * s for s in ss) / len(ss)) if ss else 0
          print('$case: peak=%d (%.1fdBFS) rms=%.0f (%.1fdBFS)' % (
              peak, 20 * math.log10(peak / 32768) if peak else -99,
              rms, 20 * math.log10(rms / 32768) if rms else -99))
          "
          done

      - name: Validate the autocorrelation estimator
        working-directory: native/openevv
        # The local ETI rig measures F0 by autocorrelation; it must first
        # prove itself on known truth (our tap says hey? rises, hey. falls)
        # before any ETI number is believed.
        run: |
          for case in 'hey?' 'hey.'; do
            printf '%s\n' "$case" > /tmp/val.txt
            rm -f /tmp/val.wav
            EVV_HETERO=on ./build/probe @/tmp/val.txt /tmp/val.wav
            python3 -c "
          import wave, struct
          RATE = 11025; FL = int(0.02 * RATE)
          def f0_of(frame):
              n = len(frame)
              e0 = sum(s * s for s in frame)
              if e0 == 0: return 0
              best, bestlag = 0.0, 0
              for lag in range(RATE // 420, RATE // 50 + 1):
                  e = sum(frame[i] * frame[i + lag] for i in range(n - lag))
                  r = e / e0
                  if r > best: best, bestlag = r, lag
              return RATE / bestlag if best >= 0.3 else 0
          w = wave.open('/tmp/val.wav', 'rb'); n = w.getnframes()
          raw = w.readframes(n); w.close()
          ss = struct.unpack('<%dh' % (len(raw) // 2), raw)
          fr = [ss[j:j + FL] for j in range(0, len(ss) - FL + 1, FL // 2)]
          curve = [f for f in (f0_of(f) for f in fr) if f]
          q = max(1, len(curve) // 4)
          f1 = sum(curve[:q]) / q; f2 = sum(curve[-q:]) / q
          print('$case: estimator slope=%+.0f dir=%s' % (
              f2 - f1, 'RISE' if f2 > f1 * 1.1 else ('FALL' if f1 > f2 * 1.1 else 'flat')))
          "
          done

      - name: Show what the hetero filter writes
        working-directory: native/openevv
        # Calls the rewriting directly, past install questions: a wrong
        # answer names itself here.
        run: |
          make build/hetero LANGS="lang/enus" RULES="bytecode" -j"$(nproc)"
          printf '%s\n' 'I produce music.' 'they will produce it.' 'the produce was fresh.' 'the candidate won' 'unread messages' 'entries button' 'jose garcia is here' 'persona non grata' 'niña' 'ninya' > /tmp/hetero-cases.txt
          printf '%b\n' 'ni\361a' 'ma\361ana' >> /tmp/hetero-cases.txt
          ./build/hetero /tmp/hetero-cases.txt
