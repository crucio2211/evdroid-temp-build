name: langcheck

# Temp-only: verify one non-English language module end to end (build the
# phonemes harness for it, speak its cases, measure peak loudness). The
# enus-grained oracle stays untouched.
on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language module to build (e.g. lang/fifi, lang/ptbr)'
        required: true
      sentence:
        description: 'One sentence in the language, for the loudness probe'
        required: true

permissions:
  contents: read

jobs:
  check:
    name: language check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Make the in-tree engine a repo for patch application
        run: |
          git -C native/openevv init -q
          git -C native/openevv -c user.email=ci@temp -c user.name=temp add -A
          git -C native/openevv -c user.email=ci@temp -c user.name=temp commit -qm base

      - name: Lay our patches on
        run: |
          for patch in "$GITHUB_WORKSPACE"/native/patches/*.patch; do
            [ -e "$patch" ] || continue
            if out=$(patch -p1 --forward --silent --directory=native/openevv <"$patch" 2>&1); then
              [ -n "$out" ] && echo "$out"
              echo "applied $(basename "$patch")"
              continue
            fi
            case "$out" in
              *"previously applied"*|*"Skipping patch"*|*"already applied"*|*"Reversed"*)
                echo "already applied $(basename "$patch")"
                find native/openevv \( -name '*.rej' -o -name '*.orig' \) -delete
                continue
                ;;
            esac
            echo "$out" >&2
            echo "could not apply $(basename "$patch")" >&2
            exit 1
          done
          find native/openevv \( -name '*.rej' -o -name '*.orig' \) -delete

      - name: TEMP force exclam stores (experiment, not shipped)
        working-directory: native/openevv
        run: |
          f=lang/enus/rules/u_integ.dr
          grep -n 'load movw ind reg r6 3386 into r0w' "$f" | head -5
          sed -i '4703s/load movw ind reg r6 3386 into r0w/load movw imm 9999 into r0w/' "$f"
          sed -n '4703,4706p' "$f"

      - name: Build the phonemes harness
        working-directory: native/openevv
        run: make phonemes-bin LANGS="${{ inputs.lang }}" RULES="bytecode" OPT="-O2 -g" -j"$(nproc)"

      - name: Say its cases
        working-directory: native/openevv
        run: |
          tag="$(basename "${{ inputs.lang }}")"
          bin="./build/phonemes-$tag"
          [ -x "$bin" ] || bin="./build/phonemes"
          "$bin" "../accent-cases-$tag.txt" || echo "no cases file, probe only"
          for c in 'hey!' 'hey.' 'hey?'; do
            echo "== anno [$c] =="
            printf '%s\n' "$c" > /tmp/anno.txt
            EVV_HETERO=on EVV_ANNO=1 "$bin" /tmp/anno.txt 2>&1 | head -30
          done

      - name: TEMP dict bake like APK
        working-directory: native/openevv
        run: |
          make -f Makefile rulecode LANGS="lang/enus lang/engb lang/dede lang/eses lang/esus lang/frfr lang/frca lang/itit lang/plpl lang/jajp" >/dev/null 2>&1; EVV_LANG_DIR=lang/enus python3 tools/module/dict.py build > /tmp/bake.log 2>&1; echo "bake exit: $?"; git status --short | head -20; git diff --stat | tail -12; git diff -- lang/enus/enus.dict | grep -E "^[+-]  (encourage|mutual) " | head -8; tail -40 /tmp/bake.log; python3 tools/module/dict.py find encourage; python3 tools/module/dict.py find mutual

      - name: Peak loudness of one sentence
        working-directory: native/openevv
        run: |
          make probe LANGS="${{ inputs.lang }}" RULES="bytecode" OPT="-O2 -g" -j"$(nproc)"
          tag="$(basename "${{ inputs.lang }}")"
          bin="./build/probe-$tag"
          [ -x "$bin" ] || bin="./build/probe"
          mkdir -p /tmp/probe16 /tmp/probewav
          echo "${{ inputs.sentence }}" | tr '|' '\n' | while IFS= read -r sent; do
            [ -n "$sent" ] || continue
            nm=$(echo "$sent" | tr -dc 'A-Za-z!.' | tr 'A-Z' 'a-z' | tr '!.' 'bd')
            printf '%s\n' "$sent" > /tmp/loud.txt
            export DELTA_RULE_TRACE=0
            export EVV_INSERT_TAP=/tmp/ins.txt
            EVV_HETERO=on "$bin" @/tmp/loud.txt /tmp/loud.wav
            python3 -c "
          import wave, array
          w = wave.open('/tmp/loud.wav')
          n = w.getnframes()
          print('rate=%d' % w.getframerate())
          a = array.array('h', w.readframes(n))
          peak = max(abs(x) for x in a)
          rms = int((sum(x * x for x in a) / len(a)) ** 0.5)
          print('peak=%d rms=%d frames=%d' % (peak, rms, n))
          open('/tmp/probe16/$nm.s16','wb').write(a.tobytes())
          "
            cp /tmp/loud.wav "/tmp/probe16/$nm.wav"
            cp /tmp/loud.wav "/tmp/probewav/$nm.wav"
          done
          python3 "$GITHUB_WORKSPACE/.github/scripts/f0track.py" /tmp/probe16
          cp /tmp/probewav/*.wav /tmp/ 2>/dev/null || true

      - name: Upload the probe wav
        uses: actions/upload-artifact@v4
        with:
          name: probe-wav
          path: /tmp/probe*.wav
